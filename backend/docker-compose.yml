version: "3.9"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: globetrotter
      POSTGRES_PASSWORD: globetrotter
      POSTGRES_DB: globetrotter
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globetrotter"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    environment:
      DATABASE_URL: postgresql+asyncpg://globetrotter:globetrotter@db:5432/globetrotter
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-32chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      RESET_TOKEN_EXPIRE_MINUTES: 60
      ENVIRONMENT: development
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://globetrotter:globetrotter@db:5432/globetrotter
    depends_on:
      db:
        condition: service_healthy
    command: python seeds/seed.py
    profiles:
      - seed

volumes:
  postgres_data:
